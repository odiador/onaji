name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: onaji-darwin-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: onaji-darwin-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: onaji-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: onaji-linux-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: onaji-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p onaji-cli

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact }} onaji

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/onaji.exe -DestinationPath ${{ matrix.artifact }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-extensions:
    name: Package IDE Extensions & SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VS Code Extension
        run: |
          cd editors/vscode
          npm ci
          npx vsce package -o ../../onaji-vscode.vsix

      - name: Upload IDE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onaji-vscode.vsix
          path: onaji-vscode.vsix

  create-release:
    name: Generate Checksums & Publish GitHub Release
    needs: [build-binaries, build-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Compute SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} + > ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS
          generate_release_notes: true
