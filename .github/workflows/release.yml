name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0-rc1)'
        required: false
        default: 'v0.1.0-rc1'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          ref: ${{ github.ref_type == 'tag' && github.ref || format('refs/tags/{0}', inputs.tag || 'v0.1.0-rc1') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build Binary (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Build and Upload Binary Artifacts
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: onaji
          package: onaji-cli
          target: ${{ matrix.target }}
          archive: onaji-$target
          tar: unix
          zip: windows
          checksum: sha256
          ref: ${{ github.ref_type == 'tag' && github.ref || format('refs/tags/{0}', inputs.tag || 'v0.1.0-rc1') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-extensions:
    name: Package IDE Extensions & SDK
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VS Code Extension
        run: |
          cd editors/vscode
          npm ci
          npx vsce package -o ../../onaji-vscode.vsix

      - name: Attach IDE Extension to Release
        uses: softprops/action-gh-release@v2
        with:
          files: onaji-vscode.vsix
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.0-rc1' }}
