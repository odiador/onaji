name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo Test Suite
        run: cargo test --workspace --all-targets --all-features

  selective-ci:
    name: ONΛJI Selective Execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies & Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            target/
          key: cargo-selective-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-selective-

      - name: Cache Onaji Execution Cache
        uses: actions/cache@v4
        with:
          path: |
            .onaji/cache
            examples/contract-driven-flow/.onaji/cache
          key: onaji-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            onaji-cache-${{ runner.os }}-

      - name: Build Onaji CLI
        run: cargo build -p onaji-cli

      - name: Verify Workspace Manifest
        run: ./target/debug/onaji --config examples/contract-driven-flow/onaji.yaml check --output github

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/contract-driven-flow/package-lock.json

      - name: Install Example Dependencies
        run: cd examples/contract-driven-flow && npm ci

      - name: Run Affected Pipeline (CI Selective Check)
        run: |
          TARGET_REF="${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          echo "Evaluating changes against: $TARGET_REF"
          ./target/debug/onaji --config examples/contract-driven-flow/onaji.yaml affected \
            --since "$TARGET_REF" \
            --run \
            --output github
