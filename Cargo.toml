[workspace]
resolver = "2"
members = [
    "crates/onaji-core",
    "crates/onaji-cli",
    "crates/onaji-protocol",
]

[workspace.package]
version = "0.1.0"
authors = ["Onaji Team <dev@onaji.dev>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/odiador/onaji"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
petgraph = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.38", features = ["full"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
