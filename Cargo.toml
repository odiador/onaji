[workspace]
resolver = "2"
members = [
    "crates/onaji-core",
    "crates/onaji-cli",
    "crates/onaji-protocol",
]

[workspace.package]
version = "0.1.0"
authors = ["Onaji Team <dev@onaji.dev>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/odiador/onaji"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
petgraph = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.38", features = ["full"] }
notify = "8.1"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
wiremock = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
tempfile = "3.17"
wasmtime = "20.0"
wat = "1.200"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tar = "0.4"
zstd = "0.13"
